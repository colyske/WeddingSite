<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WeddingSite Sign In</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #f5f5f5; }
    .container { max-width: 400px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #244b3a; margin-top: 0; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #333; }
    input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
    input:focus { outline: none; border-color: #244b3a; box-shadow: 0 0 0 3px rgba(36, 75, 58, 0.1); }
    button { background: #244b3a; color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; width: 100%; }
    button:hover { background: #1a3a2e; }
    .error { color: #d32f2f; margin-top: 0.5rem; font-size: 0.9rem; }
    .info { color: #1976d2; background: #e3f2fd; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; font-size: 0.9rem; }
    a { color: #1976d2; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WeddingSite</h1>
    <p>Sign in to manage your wedding or RSVP.</p>

    <div class="info">
      <strong>Demo note:</strong> This is a preview. Real accounts and sign-ups are not yet available. Use the platform demo or contact support.
    </div>

    <form id="signin-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit">Sign In</button>
      <div id="error" class="error"></div>
    </form>

    <p style="margin-top: 2rem; text-align: center; font-size: 0.9rem;">
      Don't have an account? <a href="https://supabase.com/docs/guides/auth/auth-email">Contact support</a> for an invitation.
    </p>
  </div>

  <script>
    document.getElementById("signin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";

      try {
        const res = await fetch("/api/auth/sign-in", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || "Sign-in failed.";
          return;
        }

        // Store token in sessionStorage and redirect
        sessionStorage.setItem("access-token", data.accessToken);
        window.location.href = data.profile?.platform_role === "owner" ? "/dashboard.html" : "/platform.html";
      } catch (error) {
        errorEl.textContent = "Network error. Try again.";
        console.error("Sign-in error:", error);
      }
    });
  </script>
</body>
</html>
