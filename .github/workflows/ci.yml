name: WeddingSite checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local database
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply all migrations to a fresh database
        run: supabase db reset --local --no-seed
      - name: Lint the migrated schema
        run: supabase db lint --local --schema public --level error
      - name: Test payout KYC enforcement without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/payout-kyc.sql
      - name: Test contribution privacy and content guards without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/contribution-content.sql
      - name: Test verified publication checkout without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/publication-checkout.sql
      - name: Test USD publication FX without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/publication-fx.sql
      - name: Test organizer amount presets without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/wedding-amount-presets.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
