name: WeddingSite checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start isolated local database
        run: supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Prepare the predecessor schema for populated upgrade regression
        run: supabase db reset --local --version 202611040002 --no-seed
      - name: Test publication migration with existing published weddings and drafts
        run: node tests/db/guided-publication-upgrade.mjs
      - name: Apply optional-content predecessor on populated database
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < supabase/migrations/202611080001_optional_cover_and_guest_instructions.sql
      - name: Commit starter migration on populated predecessor without changing existing weddings
        run: node tests/db/wedding-starter-upgrade.mjs
      - name: Commit manual-payout control plane on populated predecessor and test DDL rollback
        run: node tests/db/manual-payout-upgrade.mjs
      - name: Apply all migrations to a fresh database
        run: supabase db reset --local --no-seed
      - name: Lint the migrated schema
        run: supabase db lint --local --schema public --level error
      - name: Test payout KYC enforcement without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/payout-kyc.sql
      - name: Test contribution privacy and content guards without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/contribution-content.sql
      - name: Test verified publication checkout without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/publication-checkout.sql
      - name: Test USD publication FX without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/publication-fx.sql
      - name: Test organizer amount presets without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/wedding-amount-presets.sql
      - name: Test support authorization and sandbox-funds boundaries without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/support-boundaries.sql
      - name: Test moderation corrections without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/moderation-corrections.sql
      - name: Test live Daraja guards without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/live-daraja.sql
      - name: Test paid custom sponsorship without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/custom-sponsorship.sql
      - name: Test shared-ledger default-off B2C automation
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/b2c.sql
      - name: Race actual manual and automatic payout reservations and claims
        env:
          B2C_TEST_DB_CONTAINER: supabase_db_weddingsite
        run: node tests/db/b2c-concurrency.mjs
      - name: Test live Paystack split and publication guards without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/paystack-live.sql
      - name: Test standard Paystack collection and immutable Owner settlement modes without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/paystack-standard.sql
      - name: Test wedding helper role boundaries without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/wedding-team.sql
      - name: Test held client referrals without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/referral-commissions.sql
      - name: Test amount-ranked sponsor and verified song placement without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/amount-ranked-sponsors.sql
      - name: Test concurrent first-valid client referral capture
        env:
          REFERRAL_TEST_DB_CONTAINER: supabase_db_weddingsite
        run: node tests/db/referral-concurrency.mjs
      - name: Test incomplete guided drafts, idempotency and publication invariants without retaining fixtures
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/guided-wedding-drafts.sql
      - name: Test starter proof gates, atomic rollback and idempotent configuration copying
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/wedding-starter-drafts.sql
      - name: Test manual payout evidence, accounting, uncertainty and role boundaries with rollback
        run: docker exec -i supabase_db_weddingsite psql -U postgres -d postgres --set ON_ERROR_STOP=1 < tests/db/manual-payouts.sql
      - name: Test two-connection reservations, durable claims and duplicate receipts
        env:
          MANUAL_PAYOUT_TEST_DB_CONTAINER: supabase_db_weddingsite
        run: node tests/db/manual-payout-concurrency.mjs
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run check:referrals
      - run: npm test
      - name: Capture exact-head starter mobile evidence
        if: github.event_name == 'push'
        env:
          STARTER_EVIDENCE_DIR: ${{ runner.temp }}/starter-mobile-evidence
        run: node --test tests/wedding-inspiration.browser.test.js
      - name: Upload starter mobile screenshots and asset hashes
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: starter-mobile-evidence
          path: ${{ runner.temp }}/starter-mobile-evidence
          if-no-files-found: error
