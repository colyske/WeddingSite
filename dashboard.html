<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203a31">
  <title>WeddingSite — Workspace</title>
  <link rel="stylesheet" href="app-shell.css">
  <style>
    .color-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin: 1.5rem 0; }
    .color-grid small { color: #7a8580; }
    .venue-item { padding: 1rem; border: 2px solid #ddd; border-radius: 8px; background: #fafbf9; margin-bottom: 1rem; }
    .venue-item input[type="text"], .venue-item input[type="time"], .venue-item input[type="url"], .venue-item textarea {
      display: block; width: 100%; margin-bottom: .75rem; padding: .75rem; border: 1px solid #d0d5cc; border-radius: 6px; font-family: inherit;
    }
    .venue-item textarea { resize: vertical; min-height: 60px; }
    .venue-main-label { display: flex; align-items: center; gap: .5rem; cursor: pointer; margin: 0 0 1rem; font-weight: 500; }
    .remove-venue { padding: .5rem 1rem; background: #d9534f; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: .9rem; }
    #add-venue { padding: .75rem 1.5rem; background: #5cb85c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 500; margin-bottom: 1rem; }
    #created { border: 2px solid #5cb85c; border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1.5rem; background: #f3faf3; }
    button:disabled { opacity: .6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="/">WeddingSite</a>
      <button type="button" class="link" id="sign-out" data-action="sign-out">Sign out</button>
    </div>

    <h1>My Weddings</h1>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
    <div id="created" role="status" hidden></div>

    <div id="create-section" class="card">
      <h2>✨ Plan a new wedding</h2>
      <p style="color: #7a8580; margin: 0 0 2rem;">Start your wedding journey with us</p>
      <form id="create-form" novalidate onsubmit="return false">
        <label for="couple-names">👰 Couple names</label>
        <input id="couple-names" type="text" maxlength="120" placeholder="e.g. Sarah &amp; John" autocomplete="off">

        <label for="wedding-date">📅 Wedding date (optional)</label>
        <input id="wedding-date" type="date">

        <label for="location">📍 Location</label>
        <input id="location" type="text" maxlength="120" placeholder="City, venue, or coordinates" autocomplete="off">

        <label for="currency">💵 Primary currency</label>
        <select id="currency">
          <option value="USD">USD - US Dollar</option>
          <option value="KES">KES - Kenyan Shilling</option>
          <option value="EUR">EUR - Euro</option>
          <option value="GBP">GBP - British Pound</option>
          <option value="NGN">NGN - Nigerian Naira</option>
          <option value="UGX">UGX - Ugandan Shilling</option>
          <option value="ZAR">ZAR - South African Rand</option>
        </select>

        <label for="max-capacity">👥 Maximum guest capacity</label>
        <input id="max-capacity" type="number" min="1" step="1" value="150">

        <label>🎨 Wedding colour palette (4 colours)</label>
        <div class="swatches" id="palette-preview">
          <span id="swatch-1" style="background: #244b3a;" title="Colour 1"></span>
          <span id="swatch-2" style="background: #a9b5a2;" title="Colour 2"></span>
          <span id="swatch-3" style="background: #be9b52;" title="Colour 3"></span>
          <span id="swatch-4" style="background: #eee8d9;" title="Colour 4"></span>
        </div>
        <button type="button" class="link" id="edit-palette" data-action="toggle-palette" aria-expanded="false">✎ Edit colours</button>

        <div id="palette-editor" hidden>
          <div class="color-grid">
            <div><label for="color-1">Colour 1</label><input id="color-1" type="color" value="#244b3a" data-color-index="0"><small>Forest Green</small></div>
            <div><label for="color-2">Colour 2</label><input id="color-2" type="color" value="#a9b5a2" data-color-index="1"><small>Eucalyptus Sage</small></div>
            <div><label for="color-3">Colour 3</label><input id="color-3" type="color" value="#be9b52" data-color-index="2"><small>Royal Gold</small></div>
            <div><label for="color-4">Colour 4</label><input id="color-4" type="color" value="#eee8d9" data-color-index="3"><small>Ivory</small></div>
          </div>
          <button type="button" id="save-palette" data-action="save-palette">✓ Save colours</button>
          <button type="button" class="link" id="reset-palette" data-action="reset-palette">Reset to defaults</button>
        </div>

        <label>📍 Venues (optional) — choose one as the main venue</label>
        <div id="venues-container"></div>
        <button type="button" id="add-venue" data-action="add-venue">+ Add another venue</button>

        <button type="submit" id="create-submit">✨ Create wedding</button>
      </form>
    </div>

    <div id="weddings-container" hidden>
      <h2>Your weddings</h2>
      <div class="grid" id="weddings-grid"></div>
    </div>
    <p id="empty" class="fine">Loading your weddings…</p>
  </div>

  <script src="auth-client.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
