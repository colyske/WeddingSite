<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203a31">
  <title>WeddingSite — Workspace</title>
  <link rel="stylesheet" href="app-shell.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="/">WeddingSite</a>
      <button type="button" class="link" id="sign-out">Sign out</button>
    </div>

    <h1>My Weddings</h1>
    <p id="notice" class="notice" role="status" hidden></p>

    <!-- Create new wedding -->
    <div id="create-section" class="card">
      <h2>✨ Plan a new wedding</h2>
      <p style="color: #7a8580; margin: 0 0 2rem;">Start your wedding journey with us</p>
      <form id="create-form">
        <label for="couple-names">👰 Couple names</label>
        <input id="couple-names" type="text" maxlength="120" placeholder="e.g. Sarah & John" required>

        <label for="wedding-date">📅 Wedding date (optional)</label>
        <input id="wedding-date" type="date">

        <label for="location">📍 Location</label>
        <input id="location" type="text" maxlength="120" placeholder="City, venue, or coordinates">

        <label for="currency">💵 Primary currency</label>
        <select id="currency">
          <option value="USD">USD - US Dollar</option>
          <option value="KES">KES - Kenyan Shilling</option>
          <option value="EUR">EUR - Euro</option>
          <option value="GBP">GBP - British Pound</option>
          <option value="NGN">NGN - Nigerian Naira</option>
          <option value="UGX">UGX - Ugandan Shilling</option>
          <option value="ZAR">ZAR - South African Rand</option>
        </select>

        <label for="max-capacity">👥 Maximum guest capacity</label>
        <input id="max-capacity" type="number" min="1" value="150">

        <label>🎨 Wedding colour palette (up to 4 colours)</label>
        <div class="swatches" id="palette-preview">
          <span id="swatch-1" style="background: #244b3a;" title="Forest Green"></span>
          <span id="swatch-2" style="background: #a9b5a2;" title="Eucalyptus Sage"></span>
          <span id="swatch-3" style="background: #be9b52;" title="Royal Gold"></span>
          <span id="swatch-4" style="background: #eee8d9;" title="Ivory"></span>
        </div>
        <button type="button" class="link" id="edit-palette">✎ Edit colours</button>

        <div id="palette-editor" hidden>
          <div class="color-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin: 1.5rem 0;">
            <div class="color-input">
              <label for="color-1">Colour 1</label>
              <input id="color-1" type="color" value="#244b3a">
              <small style="color: #7a8580;">Forest Green</small>
            </div>
            <div class="color-input">
              <label for="color-2">Colour 2</label>
              <input id="color-2" type="color" value="#a9b5a2">
              <small style="color: #7a8580;">Eucalyptus Sage</small>
            </div>
            <div class="color-input">
              <label for="color-3">Colour 3</label>
              <input id="color-3" type="color" value="#be9b52">
              <small style="color: #7a8580;">Royal Gold</small>
            </div>
            <div class="color-input">
              <label for="color-4">Colour 4</label>
              <input id="color-4" type="color" value="#eee8d9">
              <small style="color: #7a8580;">Ivory</small>
            </div>
          </div>
          <button type="button" id="save-palette">✓ Save colours</button>
        </div>

        <label>📍 Venues (optional)</label>
        <div id="venues-container" style="display: flex; flex-direction: column; gap: 1rem;">
          <div class="venue-item" style="padding: 1rem; border: 2px solid #ddd; border-radius: 8px; background: #fafbf9;">
            <input type="text" class="venue-name" placeholder="e.g. Church Service" maxlength="100" style="margin-bottom: 0.75rem; display: block; width: 100%; padding: 0.75rem; border: 1px solid #d0d5cc; border-radius: 6px; font-family: inherit;">
            <input type="time" class="venue-time" style="margin-bottom: 0.75rem; display: block; width: 100%; padding: 0.75rem; border: 1px solid #d0d5cc; border-radius: 6px; font-family: inherit;">
            <input type="url" class="venue-map" placeholder="Map link (Google Maps, Apple Maps, etc.)" maxlength="500" style="margin-bottom: 0.75rem; display: block; width: 100%; padding: 0.75rem; border: 1px solid #d0d5cc; border-radius: 6px; font-family: inherit;">
            <textarea class="venue-description" placeholder="Description (e.g., Church address, parking info)" maxlength="500" style="display: block; width: 100%; padding: 0.75rem; border: 1px solid #d0d5cc; border-radius: 6px; font-family: inherit; resize: vertical; min-height: 60px;"></textarea>
            <button type="button" class="remove-venue" style="margin-top: 0.75rem; padding: 0.5rem 1rem; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem;">✕ Remove venue</button>
          </div>
        </div>
        <button type="button" id="add-venue" style="margin-top: 0.75rem; padding: 0.75rem 1.5rem; background: #5cb85c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 500;">+ Add another venue</button>

        <button type="submit">✨ Create wedding</button>
      </form>
    </div>

    <!-- Weddings list -->
    <div id="weddings-container" hidden>
      <h2>Your weddings</h2>
      <div class="grid" id="weddings-grid"></div>
    </div>
    <p id="empty" class="fine">Loading your weddings…</p>
  </div>

  <script src="auth-client.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const notice = (text, bad) => { $("notice").hidden = !text; $("notice").textContent = text || ""; $("notice").className = "notice" + (bad ? " bad" : ""); };
    
    // Palette state management
    let currentPalette = ["#244b3a", "#a9b5a2", "#be9b52", "#eee8d9"];
    
    const togglePalette = () => { $("palette-editor").hidden = !$("palette-editor").hidden; };
    
    const updatePalettePreview = () => {
      currentPalette = [$("color-1").value, $("color-2").value, $("color-3").value, $("color-4").value];
      for (let i = 0; i < 4; i++) {
        $(`swatch-${i+1}`).style.background = currentPalette[i];
      }
    };

    // Ensure session
    if (!WS.token()) return location.replace("/signin.html");

    // Sign out
    $("sign-out").addEventListener("click", () => {
      WS.clear();
      location.replace("/signin.html");
    });

    // Palette editor - Initialize listeners
    $("edit-palette").addEventListener("click", (e) => {
      e.preventDefault();
      togglePalette();
    });
    
    // Color input listeners
    for (let i = 1; i <= 4; i++) {
      $(`color-${i}`).addEventListener("input", updatePalettePreview);
    }
    
    // Save palette button
    $("save-palette").addEventListener("click", (e) => { 
      e.preventDefault(); 
      updatePalettePreview(); // Ensure palette is updated
      togglePalette(); 
    });

    // Venues management
    let venueCount = 1;
    
    const getVenueData = () => {
      const venues = [];
      document.querySelectorAll(".venue-item").forEach((item) => {
        const name = item.querySelector(".venue-name")?.value || "";
        const time = item.querySelector(".venue-time")?.value || "";
        const map = item.querySelector(".venue-map")?.value || "";
        const description = item.querySelector(".venue-description")?.value || "";
        
        // Only add if at least one field is filled
        if (name.trim() || time || map.trim() || description.trim()) {
          venues.push({ name: name.trim(), time, map: map.trim(), description: description.trim() });
        }
      });
      return venues;
    };
    
    const addVenueRow = () => {
      venueCount++;
      const container = $("venues-container");
      const venueItem = document.createElement("div");
      venueItem.className = "venue-item";
      venueItem.style.cssText = "padding: 1rem; border: 2px solid #ddd; border-radius: 8px; background: #fafbf9;";
      venueItem.innerHTML = `
        <input type="text" class="venue-name" placeholder="e.g. Reception Hall" maxlength="100" style="margin-bottom: 0.75rem; display: block; width: 100%; padding: 0.75rem; border: 1px solid #d0d5cc; border-radius: 6px; font-family: inherit;">
        <input type="time" class="venue-time" style="margin-bottom: 0.75rem; display: block; width: 100%; padding: 0.75rem; border: 1px solid #d0d5cc; border-radius: 6px; font-family: inherit;">
        <input type="url" class="venue-map" placeholder="Map link (Google Maps, Apple Maps, etc.)" maxlength="500" style="margin-bottom: 0.75rem; display: block; width: 100%; padding: 0.75rem; border: 1px solid #d0d5cc; border-radius: 6px; font-family: inherit;">
        <textarea class="venue-description" placeholder="Description (e.g., venue address, parking info)" maxlength="500" style="display: block; width: 100%; padding: 0.75rem; border: 1px solid #d0d5cc; border-radius: 6px; font-family: inherit; resize: vertical; min-height: 60px;"></textarea>
        <button type="button" class="remove-venue" style="margin-top: 0.75rem; padding: 0.5rem 1rem; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem;">✕ Remove venue</button>
      `;
      
      venueItem.querySelector(".remove-venue").addEventListener("click", (e) => {
        e.preventDefault();
        venueItem.remove();
      });
      
      container.appendChild(venueItem);
    };
    
    $("add-venue").addEventListener("click", (e) => {
      e.preventDefault();
      addVenueRow();
    });
    
    // Remove venue listeners (for initial venue)
    document.querySelectorAll(".remove-venue").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        btn.closest(".venue-item").remove();
      });
    });

    // Create wedding - FIX: Get palette before submitting form
    $("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      notice("");
      
      // Get current palette (from color inputs or swatches)
      const palette = [
        $("color-1").value || currentPalette[0],
        $("color-2").value || currentPalette[1],
        $("color-3").value || currentPalette[2],
        $("color-4").value || currentPalette[3]
      ];
      
      // Get form values
      const coupleNames = $("couple-names").value;
      const weddingDate = $("wedding-date").value || null;
      const location = $("location").value;
      const currency = $("currency").value;
      const maxCapacity = Number($("max-capacity").value);
      const venues = getVenueData();
      
      // Validate
      if (!coupleNames.trim()) return notice("Please enter the couple's names.", true);
      if (!location.trim()) return notice("Please enter a location.", true);
      
      // Make the request
      const res = await WS.api("/api/weddings?action=create", {
        method: "POST",
        body: JSON.stringify({
          coupleNames,
          weddingDate,
          location,
          currency,
          maxCapacity,
          palette,
          venues
        })
      });
      
      const data = await res.json();
      if (!res.ok) return notice(data.error || "Could not create wedding.", true);
      
      notice(`🎉 Wedding created! Redirecting…`);
      setTimeout(() => location.href = `/wedding.html?id=${encodeURIComponent(data.weddingId)}&slug=${encodeURIComponent(data.slug)}`, 800);
    });

    // Load weddings
    async function loadWeddings() {
      const res = await WS.api("/api/weddings?action=list");
      const data = await res.json();
      if (!res.ok) return notice(data.error || "Could not load weddings.", true);
      
      const weddings = data.weddings || [];
      $("empty").hidden = weddings.length > 0;
      $("weddings-container").hidden = weddings.length === 0;

      if (weddings.length === 0) return;

      $("weddings-grid").innerHTML = weddings.map(w => `
        <div class="card">
          <div class="top" style="margin-bottom: .5rem;">
            <span class="tag ${w.published_at ? "live" : ""}">${w.published_at ? "✓ Published" : "📋 Draft"}</span>
            <span class="fine">${new Date(w.created_at).toLocaleDateString()}</span>
          </div>
          <h3>${WS.esc(w.couple_names)}</h3>
          <p class="fine" style="margin: 0.5rem 0;">
            ${w.wedding_date ? '📅 ' + new Date(w.wedding_date).toLocaleDateString() : "(No date set)"}
            ${w.public_location ? " • 📍 " + WS.esc(w.public_location) : ""}
          </p>
          <p class="fine" style="margin: 0.5rem 0;">👥 Max ${w.max_guest_capacity} guests • ${w.currency}</p>
          <div class="swatches">
            ${(w.palette || []).map(c => `<span style="background: ${WS.esc(c)};"></span>`).join("")}
          </div>
          <div class="row" style="margin-top: 1.5rem;">
            <a class="btn" href="/wedding.html?id=${encodeURIComponent(w.id)}&slug=${encodeURIComponent(w.slug)}">✎ Edit</a>
            ${w.published_at ? `<a class="btn" href="/guest.html?slug=${encodeURIComponent(w.slug)}" target="_blank">👁 View</a>` : ""}
          </div>
        </div>
      `).join("");
    }

    loadWeddings();
  </script>
</body>
</html>
